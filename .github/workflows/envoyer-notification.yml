name: Envoyer une notification BlogAN
on:
  workflow_dispatch:
    inputs:
      article_id:
        description: "Identifiant de l'article (ex. article-3)"
        required: true
        type: string
      titre:
        description: "Titre de la notification"
        required: true
        type: string
        default: "BlogAN 🍍"
      message:
        description: "Message de la notification"
        required: true
        type: string
        default: "Un nouvel article est disponible !"
permissions:
  contents: read
jobs:
  envoyer:
    runs-on: ubuntu-latest
    steps:
      - name: Envoyer la notification
        env:
          ADMIN_TOKEN: ${{ secrets.BLOGAN_ADMIN_TOKEN }}
          ARTICLE_ID: ${{ inputs.article_id }}
          TITRE: ${{ inputs.titre }}
          MESSAGE: ${{ inputs.message }}
        run: |
          set -euo pipefail
          if [[ ! "$ARTICLE_ID" =~ ^[a-zA-Z0-9_-]+$ ]]; then
            echo "Identifiant d'article invalide."
            exit 1
          fi
          if [[ -z "$ADMIN_TOKEN" ]]; then
            echo "Erreur : le secret BLOGAN_ADMIN_TOKEN est absent."
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error
          article_id = os.environ["ARTICLE_ID"]
          payload = {
              "title": os.environ["TITRE"],
              "body": os.environ["MESSAGE"],
              "url": "/BlogAN/?article=" + article_id
          }
          request = urllib.request.Request(
              "https://blogan-push.nancy2687.workers.dev/send",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": "Bearer " + os.environ["ADMIN_TOKEN"],
                  "Content-Type": "application/json",
                  "User-Agent": "BlogAN-Notification/1.0"
              },
              method="POST"
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = response.read().decode("utf-8")
                  print("Code HTTP :", response.status)
                  print("Réponse du serveur :", result)
          except urllib.error.HTTPError as error:
              print("Erreur HTTP :", error.code)
              print("Réponse du serveur :", error.read().decode("utf-8"))
              raise
          except urllib.error.URLError as error:
              print("Erreur de connexion :", error.reason)
              raise
          PY
